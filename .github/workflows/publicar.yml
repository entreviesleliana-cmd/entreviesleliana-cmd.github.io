# Publica la web en GitHub Pages cada vez que se guarda un cambio.
# Antes de publicar comprueba que contenido.js no tiene errores:
# si los tiene, NO publica y la web sigue mostrando la última versión buena.
name: Comprobar y publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que contenido.js no tiene errores
        run: node --check contenido.js && node --check idiomas.js && node --check web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
